[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-assistant-2"
version = "0.1.0"
description = "Voice assistant for Raspberry Pi + Jetson with Home Assistant control"
requires-python = ">=3.11"

dependencies = [
    # WebSocket
    "websockets>=12.0",
    # Audio capture
    "pyaudio>=0.2.13",
    # Voice Activity Detection
    # Wake word detection
    "openwakeword>=0.6.0",
    "onnxruntime>=1.16.0",
    # HTTP client for Home Assistant
    "aiohttp>=3.9.0",
    # Audio processing
    "numpy>=1.24.0",
    "setuptools>=82.0.1",
    "webrtcvad-wheels>=2.0.14",
]

[project.optional-dependencies]
jetson = [
    # Faster-whisper for speech-to-text (CUDA optimized)
    "faster-whisper>=1.0.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pi", "jetson", "shared"]
